workflows:
  ios-tdl:
    name: TDL iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - iOS_signing_tdl
        - supabase_tdl
      vars:
        BUNDLE_ID: "com.avocadopoker.tdl"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods (only if this project uses them)
        script: |
          if [ -f ios/App/Podfile ]; then
            echo "Podfile found - running pod install"
            cd ios/App && pod install
          else
            echo "No Podfile - project uses Swift Package Manager, skipping"
          fi

      - name: Set up code signing from stored certificate and profile
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password $CM_CERTIFICATE_PASSWORD
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $CM_PROVISIONING_PROFILE | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/tdl.mobileprovision
          xcode-project use-profiles

      - name: Set build number and version
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

          NEW_VERSION="1.$PROJECT_BUILD_NUMBER"
          echo "Target marketing version: $NEW_VERSION"

          echo "--- MARKETING_VERSION lines before ---"
          grep -n "MARKETING_VERSION" App.xcodeproj/project.pbxproj || echo "(none found)"

          # Directly patch every MARKETING_VERSION build setting in the
          # project file - this is the value Xcode actually compiles in,
          # regardless of what the physical Info.plist says.
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${NEW_VERSION};/g" App.xcodeproj/project.pbxproj

          echo "--- MARKETING_VERSION lines after ---"
          grep -n "MARKETING_VERSION" App.xcodeproj/project.pbxproj || echo "(still none - setting does not exist in this project)"

          # Belt-and-suspenders: also write it into the physical Info.plist
          # in case this key isn't present there at all yet.
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${NEW_VERSION}" App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NEW_VERSION}" App/Info.plist 2>/dev/null || \
          echo "Info.plist CFBundleShortVersionString not directly settable (likely auto-generated)"

      - name: Build ipa
        script: |
          if [ -d "$XCODE_WORKSPACE" ]; then
            echo "Building from workspace (CocoaPods)"
            xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
          else
            echo "Building from project (SPM)"
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
